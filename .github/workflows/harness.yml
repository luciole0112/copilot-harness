name: Harness
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HARNESS_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$HARNESS_PR_BASE" HEAD --
      - run: node scripts/harness.mjs doctor
      # Add project runtime and locked dependency installation here before enabling a project profile.
      - run: node scripts/harness.mjs verify --mode deep
